<div class="login-container" style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
  <h2 style="text-align: center; margin-top: 0; color: #333;">Bejelentkezés</h2>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Email cím:</label>
      <input type="email" name="email" [(ngModel)]="loginModel.email" required email style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Jelszó:</label>
      <input type="password" name="password" [(ngModel)]="loginModel.password" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    </div>

    <button type="submit" [disabled]="!loginForm.form.valid" style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">
      Belépés
    </button>

    <!-- Dinamikus hiba- és sikerüzenetek -->
    <div *ngIf="errorMessage" style="color: #dc3545; margin-top: 15px; font-weight: bold; text-align: center; padding: 8px; background-color: #f8d7da; border-radius: 4px;">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" style="color: #28a745; margin-top: 15px; font-weight: bold; text-align: center; padding: 8px; background-color: #d4edda; border-radius: 4px;">
      {{ successMessage }}
    </div>

  </form>
</div>
