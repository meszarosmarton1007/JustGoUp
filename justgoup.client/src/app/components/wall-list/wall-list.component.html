<div class="walls-page" style="max-width: 1100px; margin: 30px auto; padding: 20px; display: flex; gap: 40px;">

  <!-- BAL OLDAL: FALAK LISTÁJA (BÁRKI LÁTHATJA) -->
  <div class="walls-list-section" style="flex: 2;">
    <button routerLink="/gyms" style="padding: 6px 12px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 15px;">⬅ Vissza a termekhez</button>
    <h2>Oszlopok / Szektorok - {{ gymName }}</h2>

    <div *ngIf="walls.length === 0" style="padding: 20px; background: #f8f9fa; border-radius: 4px; border: 1px solid #dee2e6;">
      <p style="margin: 0; color: #6c757d;">Ehhez a teremhez még nincsenek falak feltöltve.</p>
    </div>

    <div class="walls-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px;">
      <div class="wall-card" *ngFor="let wall of walls" style="border: 1px solid #ddd; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); background: white; display: flex; flex-direction: column; justify-content: space-between;">

        <!-- A CLOUDINARY-BÓL SZÁRMAZÓ KÉP -->
        <img [src]="wall.imageUrl" alt="Mászófal" style="width: 100%; height: 200px; object-fit: cover; background: #eee;">

        <div style="padding: 15px;">
          <h3 style="margin: 0; color: #333;">{{ wall.name }}</h3>
          <span style="display: inline-block; padding: 3px 8px; background: #e9ecef; border-radius: 12px; font-size: 12px; margin-top: 5px; font-weight: bold; color: #495057;">
            {{ wall.wallType }}
          </span>

          <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button style="flex: 2; padding: 8px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">🎯 Utak megnyitása</button>
            <button (click)="onDeleteWall(wall.id)" style="flex: 1; padding: 8px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Töröl</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JOBB OLDAL: KÉPFELTÖLTŐ ŰRLAP -->
  <div class="walls-form-section" style="flex: 1; background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #eee; height: fit-content;">
    <h3 style="margin-top: 0; color: #333;">Új szektor feltöltése</h3>

    <form (ngSubmit)="onSubmit()" #wallForm="ngForm">
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Szektor neve:</label>
        <input type="text" name="wName" [(ngModel)]="wallName" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Fal típusa:</label>
        <select name="wType" [(ngModel)]="wallType" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
          <option value="Boulder">Boulder (Alacsony, szivacsos)</option>
          <option value="TopRope">Top Rope (Felső biztosításos)</option>
          <option value="Lead">Lead (Elölmászó fal)</option>
          <option value="Kilter/Moon">Kilter / Moon Board</option>
        </select>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Fénykép a falról:</label>
        <input id="fileInput" type="file" (change)="onFileSelected($event)" accept="image/*" required style="width: 100%;">
      </div>

      <button type="submit" [disabled]="isUploading || !wallForm.form.valid || !selectedFile" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px;">
        {{ isUploading ? 'Feltöltés a felhőbe...' : 'Szektor mentése' }}
      </button>

      <div *ngIf="errorMessage" style="color: red; margin-top: 10px; font-weight: bold; font-size: 13px;">{{ errorMessage }}</div>
      <div *ngIf="successMessage" style="color: green; margin-top: 10px; font-weight: bold; font-size: 13px;">{{ successMessage }}</div>
    </form>
  </div>

</div>
